# Contoh Nginx untuk Chameleon Console.
#
# Pasang di /etc/nginx/sites-available/chameleon-console, sesuaikan nama domain,
# lalu: ln -s ../sites-available/chameleon-console sites-enabled/ && nginx -t
#
# PENTING: karena server berada di belakang proxy ini, set TRUST_PROXY=1 di
# /opt/chameleon-console/.env agar IP asli klien dipakai untuk rate limit dan
# log audit. Tanpa itu, semua request tercatat dari 127.0.0.1.

# Batas tambahan di sisi proxy (aplikasi sendiri membatasi 60 req/menit/IP).
limit_req_zone $binary_remote_addr zone=chameleon:10m rate=2r/s;

upstream chameleon {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 80;
    server_name osint.contoh.com;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name osint.contoh.com;

    ssl_certificate     /etc/letsencrypt/live/osint.contoh.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/osint.contoh.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Server bawaan TIDAK punya login. Aktifkan salah satu:
    #   a) Basic Auth
    auth_basic           "Chameleon Console";
    auth_basic_user_file /etc/nginx/.htpasswd;
    #   b) atau SSO (Authelia / Authentik / Cloudflare Access) di depan Nginx.

    client_max_body_size 1m;

    # Header keamanan dasar.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        limit_req zone=chameleon burst=20 nodelay;

        proxy_pass http://chameleon;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Investigasi penuh bisa memanggil puluhan API pihak ketiga.
        proxy_connect_timeout 10s;
        proxy_send_timeout    180s;
        proxy_read_timeout    180s;
    }

    # Health check tanpa auth agar monitoring tetap bisa memantau.
    location = /api/health {
        auth_basic off;
        access_log off;
        proxy_pass http://chameleon;
        proxy_set_header Host $host;
    }
}
